# Ticker -> bucket seed map (Chunk 2.5 — Hybrid bucket assignment).
#
# Flat map: TICKER: bucket. Read by modules/finance/buckets.py's
# infer_bucket() (mtime-cached — edit and save, no restart needed).
#
# The four buckets (Investment_Philosophy.md § 0, LOCKED targets):
#   etf_foundation  (49%) — broad index/diversified ETFs, the portfolio's core.
#   single_stocks   (21%) — individual equities, max 5% each (7% drift trigger).
#   crypto          (24%) — coins/tokens, max 8% each; >30% total forces a trim.
#   wild_cards       (6%) — small speculative/optionality bets, max 2% each.
#
# Resolution order (modules/finance/buckets.py resolve_bucket): a per-position
# override in data/positions.json wins if set, else this map, else
# "unassigned". This file is the *default* — it never overrides a manual
# choice made via the Holdings-tab bucket dropdown.
#
# Tickers not listed here (anything not currently held/watched) simply return
# "unassigned" until either added here or given a manual override — no error.
#
# Uncertain calls default to single_stocks with a comment explaining why.

# --- ETF Foundation -----------------------------------------------------
VWCE.DE: etf_foundation   # Vanguard FTSE All-World UCITS ETF
CSPX.L: etf_foundation    # iShares Core S&P 500 UCITS ETF
EXSA.DE: etf_foundation   # iShares STOXX Europe 600 UCITS ETF (DE) — best guess
                          # for "the STOXX 600 tracker"; confirm/replace with
                          # the exact ticker if this isn't the one held.

